name: News publication hold (read-only preflight)

# There is intentionally no schedule, generator, media download, or publish job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify publication stays disabled
        run: node --test scripts/news-publish-hold.test.mjs scripts/wp-draft-payload.test.mjs
